name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  web-build:
    name: web — next buil
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Build web
        run: cd apps/web && npm run build
        env:
          NEXT_PUBLIC_SOLANA_NETWORK: devnet
          NEXT_PUBLIC_PROGRAM_ID: 2ywztkP4gaJr2HtmBvqMXrBWab3FLd3uG6TjGXvVogJL
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          NEXT_PUBLIC_API_URL: https://api.potbot.fun
          NEXT_PUBLIC_PRIVY_APP_ID: placeholder-privy-id

  sdk-typecheck:
    name: sdk — tsc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm install --no-audit --no-fund
      - name: tsc --noEmit (SDK)
        run: |
          cd packages/sdk
          npx tsc -p tsconfig.json --noEmit

  api-typecheck:
    name: api — tsc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm install --no-audit --no-fund
      - name: tsc --noEmit (API)
        run: |
          cd apps/api
          npx tsc -p tsconfig.json --noEmit || echo "::warning::API type-check — non-blocking"

  anchor-build:
    name: anchor — build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.86.0
        with:
          toolchain: "1.86.0"
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            packages/program/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: anchor build
        run: cd packages/program && cargo check --locked
      - name: Upload IDL artifact
        uses: actions/upload-artifact@v4
        with:
          name: pot_vault-idl
          path: packages/program/target/idl/pot_vault.json

  security-audit:
    name: npm audit
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm install --no-audit --no-fund
      - name: Audit for high/critical vulnerabilities
        run: npm audit --audit-level=high || echo "::warning::Audit found issues — review before mainnet"
