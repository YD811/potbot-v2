[package]
name = "pot-vault"
version = "0.1.0"
description = "PotBot collective trading vault program"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "pot_vault"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
anchor-spl = "0.30.1"
mpl-token-metadata = "4.1.2"  # For NFT metadata
solana-program = "1.18"