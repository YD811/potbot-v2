[workspace]
members = [
    "programs/pot_vault",
]
resolver = "2"

[profile.release]
overflow-checks = true
lto = "thin"
opt-level = 3
incremental = true
codegen-units = 1

[profile.dev]
overflow-checks = true

# Note: an earlier workaround pinned proc-macro2 1.0.86 here because the
# default toolchain (1.85+) had dropped the unstable Span::source_file
# API that anchor-syn 0.30.1 depends on. The real fix is the rustc 1.79
# pin in rust-toolchain.toml — that toolchain still ships source_file,
# so no patch is required.
