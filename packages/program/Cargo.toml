[workspace]
members = [
    "programs/pot_vault",
]
resolver = "2"

[profile.release]
overflow-checks = true
lto = "thin"
opt-level = 3
incremental = true
codegen-units = 1

[profile.dev]
overflow-checks = true

[patch.crates-io]
proc-macro2 = { git = "https://github.com/dtolnay/proc-macro2", tag = "1.0.86" }
