[toolchain]
# 1.86 is the minimum toolchain required by AVM and its ICU deps.
# anchor build --no-idl works fine on 1.86 because --no-idl skips
# the idl-build step that calls the removed proc_macro::Span::source_file().
# cargo build-sbf also ships 1.86 with Solana CLI v2.2.
channel = "1.86.0"
components = ["rustfmt", "clippy"]
